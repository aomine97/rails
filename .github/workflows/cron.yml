# Vercel Hobby only allows daily crons, so GitHub Actions calls the hourly/15-min jobs.
# Repo secrets needed: APP_URL (https://<project>.vercel.app), CRON_SECRET (same value as in Vercel env).
name: cron
on:
  schedule:
    - cron: "5 * * * *"       # poll: hourly
    - cron: "*/10 * * * *"    # tag: every 10 min
    - cron: "0 7 * * *"       # nightly batch submit: 03:00 ET (07:00 UTC)
  workflow_dispatch:
jobs:
  poll:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: poll feeds
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/poll?limit=40"
  tag:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: enrich + tag
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/tag"
  batch:
    if: github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: submit nightly tag batch (cap 3000)
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/tag-batch?max=3000"
