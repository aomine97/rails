# Vercel Hobby only allows daily crons, so GitHub Actions calls the hourly/15-min jobs.
# Repo secrets needed: APP_URL (https://<project>.vercel.app), CRON_SECRET (same value as in Vercel env).
name: cron
on:
  schedule:
    - cron: "5 * * * *"       # poll: hourly
    - cron: "*/15 * * * *"    # tag: every 15 min
  workflow_dispatch:
jobs:
  poll:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: poll feeds
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/poll?limit=40"
  tag:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: enrich + tag
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/tag"
